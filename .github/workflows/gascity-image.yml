# gascity fork CI — build + publish our patched HyperDX prod image (UI+API) to
# ghcr.io/gascity, and GUARD that the proxy-auth patch is actually in the image
# (a rebase that drops it must fail here, not ship stock upstream). See
# GASCITY-FORK.md. Upstream's own workflows only run on `main`, so they don't
# fire on gascity-sso.
name: gascity-image

on:
  push:
    branches: [gascity-sso]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gascity-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gascity/hyperdx

jobs:
  verify:
    name: typecheck + lint + unit tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (yarn 4)
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Build common-utils (api typecheck depends on its d.ts)
        run: yarn workspace @hyperdx/common-utils run dev:build
      - name: Lint (api)
        run: yarn workspace @hyperdx/api run lint
      - name: Typecheck (api)
        run: yarn workspace @hyperdx/api exec tsc --noEmit
      - name: Unit tests (proxy-auth + config regression)
        # Anchored regex passed positionally (= testPathPattern, version-agnostic;
        # jest renamed the --testPathPattern flag) so we run ONLY the two DB-free
        # unit suites; a bare "config" would also match renderChartConfig.test.ts,
        # which needs CH/Mongo.
        run: >-
          DOTENV_CONFIG_PATH=.env.test
          yarn workspace @hyperdx/api exec jest --runInBand --ci --forceExit
          '(proxyHeaderAuth|__tests__/config)\.test\.ts$'

  build:
    name: build prod image + symbol guard + push
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          SHA=${GITHUB_SHA::12}
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "code_version=2.28.0-gascity-$SHA" >> "$GITHUB_OUTPUT"
      - name: Build prod image (load locally for the guard)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/hyperdx/Dockerfile
          target: prod
          build-contexts: |
            hyperdx=./docker/hyperdx
            api=./packages/api
            app=./packages/app
          build-args: |
            CODE_VERSION=${{ steps.meta.outputs.code_version }}
          load: true
          tags: ${{ env.IMAGE }}:ci-build
          cache-from: type=gha,scope=gascity-prod
          cache-to: type=gha,mode=max,scope=gascity-prod
      - name: Symbol guard — the patch MUST be present in the built image
        run: |
          set -euo pipefail
          for sym in IS_PROXY_AUTH_ENABLED proxyHeaderAuth PROXY_AUTH_SHARED_SECRET; do
            if docker run --rm --entrypoint sh "${IMAGE}:ci-build" \
                 -c "grep -rqF '$sym' /app/packages/api/build"; then
              echo "ok: '$sym' present in /app/packages/api/build"
            else
              echo "::error::patch symbol '$sym' NOT found — refusing to publish a stock image"
              exit 1
            fi
          done
      - name: Tag + push
        run: |
          set -euo pipefail
          SHA="${{ steps.meta.outputs.sha }}"
          docker tag "${IMAGE}:ci-build" "${IMAGE}:gascity-sso"
          docker tag "${IMAGE}:ci-build" "${IMAGE}:2.28.0-gascity-${SHA}"
          docker push "${IMAGE}:gascity-sso"
          docker push "${IMAGE}:2.28.0-gascity-${SHA}"
          echo "### published ###"
          docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:gascity-sso"
