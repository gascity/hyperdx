# gascity fork CI — build + publish our patched HyperDX prod image (UI+API) to
# ghcr.io/gascity, and GUARD that the proxy-auth patch is actually in the image
# (a rebase that drops it must fail here, not ship stock upstream). See
# GASCITY-FORK.md. The inherited upstream workflows are deleted on this branch
# and disabled in the repo's Actions settings (schedule / issue_comment /
# pull_request_target events read their workflow files from the default branch).
name: gascity-image

on:
  push:
    branches: [gascity-sso]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gascity-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gascity/hyperdx

jobs:
  verify:
    name: typecheck + lint + unit tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (yarn 4)
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Build common-utils (api typecheck depends on its d.ts)
        run: yarn workspace @hyperdx/common-utils run dev:build
      - name: Lint (api)
        run: yarn workspace @hyperdx/api run lint
      - name: Typecheck (api)
        run: yarn workspace @hyperdx/api exec tsc --noEmit
      - name: Unit tests (proxy-auth + config regression)
        # Anchored regex passed positionally (= testPathPattern, version-agnostic;
        # jest renamed the --testPathPattern flag) so we run ONLY the DB-free
        # fork suites plus upstream's config suite; a bare "config" would also
        # match renderChartConfig.test.ts, which needs CH/Mongo.
        run: >-
          DOTENV_CONFIG_PATH=.env.test yarn workspace @hyperdx/api exec jest
          --runInBand --ci --forceExit
          '(proxyHeaderAuth|proxyAuth[A-Za-z]+|__tests__/config)\.test\.ts$'

  build:
    name: build prod image + symbol guard + push
    needs: verify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          SHA=${GITHUB_SHA::12}
          # The upstream release this branch is based on (bumped by the rebase).
          VERSION=$(jq -r .version packages/app/package.json)
          {
            echo "sha=$SHA"
            echo "version=$VERSION"
            echo "code_version=$VERSION-gascity-$SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Build prod image (load locally for the guard)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/hyperdx/Dockerfile
          target: prod
          build-contexts: |
            hyperdx=./docker/hyperdx
            api=./packages/api
            app=./packages/app
          build-args: |
            CODE_VERSION=${{ steps.meta.outputs.code_version }}
          load: true
          tags: ${{ env.IMAGE }}:ci-build
          cache-from: type=gha,scope=gascity-prod
          cache-to: type=gha,mode=max,scope=gascity-prod
      - name: Symbol guard — the patch MUST be present in the built image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "${IMAGE}:ci-build" -c '
            set -eu
            for spec in \
              /app/packages/api/build/config.js:IS_PROXY_AUTH_ENABLED \
              /app/packages/api/build/config.js:PROXY_AUTH_SHARED_SECRET \
              /app/packages/api/build/config.js:PROXY_AUTH_SHARED_SECRET_PREVIOUS \
              /app/packages/api/build/middleware/proxyHeaderAuth.js:timingSafeEqual \
              /app/packages/api/build/middleware/proxyHeaderAuth.js:PROXY_AUTH_SHARED_SECRET_PREVIOUS \
              /app/packages/api/build/middleware/proxyHeaderAuth.js:consumeProxyAuthSecret \
              /app/packages/api/build/middleware/auth.js:establishProxyAuthSession \
              /app/packages/api/build/api-app.js:consumeProxyAuthSecret
            do
              file="${spec%%:*}"
              symbol="${spec#*:}"
              grep -qF "$symbol" "$file" || {
                echo "patch symbol $symbol missing from $file" >&2
                exit 1
              }
              echo "ok: $symbol present in $file"
            done
          ' || {
            echo "::error::proxy-auth patch missing from production files — refusing to publish"
            exit 1
          }
      - name: Tag + push
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.code_version }}"
          docker tag "${IMAGE}:ci-build" "${IMAGE}:gascity-sso"
          docker tag "${IMAGE}:ci-build" "${IMAGE}:${TAG}"
          docker push "${IMAGE}:gascity-sso"
          docker push "${IMAGE}:${TAG}"
          echo "### published ###"
          docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:gascity-sso"
