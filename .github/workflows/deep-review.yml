# Disabled in the Gas City public fork.
#
# Re-enable only through a separate, reviewed design with:
# - review input bound to the immutable PR head SHA;
# - verification of the actor's actual repository write permission;
# - a read-only model job; and
# - an isolated comment-writer job that never checks out or executes PR code.
name: Deep Code Review (disabled)

on:
  workflow_dispatch:

permissions: {}

jobs:
  deep-review-disabled:
    name: disabled by public-fork security policy
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Statically disabled
        run: echo "Deep review is disabled in this public fork."
