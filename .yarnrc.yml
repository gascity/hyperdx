nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.13.0.cjs

npmMinimalAgeGate: 7d

npmPreapprovedPackages:
  - '@hyperdx/*'
  # Allow @clickhouse/client* pre-release (head) builds, which are published
  # for release validation and are newer than the npmMinimalAgeGate window.
  - '@clickhouse/*'
  # TODO: remove once nx@23.1.1 (published 2026-07-30) is older than the
  # npmMinimalAgeGate window.
  - 'nx'
  - '@nx/*'
  # TODO: remove once undici@7.30.2 (published 2026-11-05) is older than the
  # npmMinimalAgeGate window. 7.30.2 is the security release fixing
  # CVE-2026-116592, -120474, -120415, -120423, -120222 and -116630.
  - 'undici'
